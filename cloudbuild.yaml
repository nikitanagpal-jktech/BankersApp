steps:
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
    dir: 'backend'
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'backend'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'bankersapp'
      - '--source'
      - './backend'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=project-8831b09b-a69e-4697-839:us-central1:bankers-db-instance'
      - '--update-env-vars=DATABASE_URL=postgresql://db_user:Niks@0920@/bankers-db?host=project-8831b09b-a69e-4697-839/cloudsql/:us-central1:bankers-db-instance'

options:
  logging: CLOUD_LOGGING_ONLY